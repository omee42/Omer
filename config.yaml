# Kanal ayarları — videoların tamamı bu dosyadaki değerlerle üretilir.
kanal:
  ad: "Pofi ile Öğreniyorum"      # Kanal adı (açıklamalarda ve kapakta kullanılır)
  maskot: "Pofi"                  # Senaryolarda {maskot} yazan her yer bu isimle değişir
  yas_grubu: "3-7 yaş"
  web: ""                         # İsterseniz açıklamaya eklenecek bağlantı

ses:
  # azure:tr-TR-EmelNeural → Microsoft Azure'un sıcak, kibar kadın sesi (ücretsiz F0 katmanı ayda
  #   500.000 karakter; bir bölüm ~3.000 karakter). AZURE_SPEECH_KEY ve AZURE_SPEECH_REGION
  #   gizli anahtarları gerekir (README → "Azure sesi"). Anahtar yoksa yedek ses kullanılır.
  # piper:fahrettin ve piper:fettah internetsiz çalışan, ticari kullanıma uygun (CC0) seslerdir.
  motor: "azure:tr-TR-EmelNeural"
  yedek: "piper:fettah"
  azure_hiz: "-8%"                # Azure sesinin hızı: eksi değer yavaşlatır (çocuklar için hafif yavaş)
  azure_perde: "+3%"              # Azure sesinin tonu: artı değer biraz inceltir, daha sıcak duyulur
  azure_aralik: 3.1               # Azure istekleri arası saniye (ücretsiz F0 katmanı dakikada 20 istek kabul eder)
  hiz: 1.12                       # Piper sesi için: 1.0 normal; büyüdükçe yavaşlar
  perde: 0                        # Piper sesi için yarım ton cinsinden inceltme/kalınlaştırma (ör. 2)
  satir_arasi: 0.45               # Cümleler arası sessizlik (saniye)
  deneme: 3                       # Her cümle kaç kez seslendirilsin? En anlaşılır olanı seçilir
  kalite_kontrol: true            # Seçimi Whisper konuşma tanıma ile yap (ilk kurulumda ~640 MB indirir)
  sozluk:                         # Yanlış okunan kelimeler için okunuş düzeltmeleri
    Pofi: "Pofi"

video:
  motor: "3d"                     # 3d: three.js ile üç boyutlu sahneler | 2d: hızlı düz çizim
  isci_3d: 2                      # 3D çizimde aynı anda çalışan tarayıcı sayısı
  genislik: 1920
  yukseklik: 1080
  fps: 30
  altyazi_goster: true            # Konuşulan cümle ekranın altında yazsın mı?
  muzik_seviyesi: 0.16            # Arka plan müziği yüksekliği (0-1)
  efekt_seviyesi: 0.55
  hedef_loudness: -14             # YouTube için LUFS

shorts:
  aktif: true                     # Her bölümden ayrıca dikey bir Shorts videosu üret
  genislik: 1080
  yukseklik: 1920

youtube:
  otomatik_yukle: false           # true ise ve gizli anahtarlar tanımlıysa YouTube'a yükler
  gizlilik: "private"             # private | unlisted | public
  yayin_saati: "17:00"            # Yalnızca gizlilik "public" iken: video bu saatte (Türkiye) yayına girer
  kategori: 27                    # 27 = Eğitim
  cocuklar_icin: true             # "Çocuklara özel" (COPPA) işareti
  etiketler: ["çocuk", "eğitici", "okul öncesi", "çocuklar için", "öğreniyorum", "Pofi"]
