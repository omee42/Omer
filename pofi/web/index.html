<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>Pofi 3D</title>
<link rel="icon" href="data:,">
<style>
  @font-face { font-family: "Baloo"; src: url("/fonts/Baloo2-ExtraBold.ttf"); font-weight: 800; }
  @font-face { font-family: "Baloo"; src: url("/fonts/Baloo2-SemiBold.ttf"); font-weight: 600; }
  @font-face { font-family: "Nunito"; src: url("/fonts/Nunito-Black.ttf"); font-weight: 900; }
  @font-face { font-family: "Nunito"; src: url("/fonts/Nunito-Bold.ttf"); font-weight: 700; }
  html, body { margin: 0; padding: 0; overflow: hidden; background: #000; }
  #stage { position: relative; overflow: hidden; }
  #stage canvas { position: absolute; left: 0; top: 0; }
  #ui { position: absolute; left: 0; top: 0; pointer-events: none; overflow: hidden; }
  /* no will-change here: a promoted layer keeps the raster scale it first drew at, so text that pops in
     from scale 0 would stay blurry for the rest of the scene */
  .el { position: absolute; left: 0; top: 0; box-sizing: border-box; transform-origin: 50% 50%; white-space: nowrap; }
  .card { background: rgba(255,255,255,0.94); border-radius: 34px; box-shadow: 0 14px 34px rgba(40,25,80,0.22), 0 2px 0 rgba(255,255,255,0.8) inset; }
  /* balanced lines: no lonely last word under a long first line */
  .body { font-family: "Nunito"; font-weight: 900; text-align: center; line-height: 1.12; white-space: normal; text-wrap: balance; }
  .title { font-family: "Baloo"; font-weight: 800; text-align: center; line-height: 1.02; white-space: normal; text-wrap: balance; }
  .pill { border-radius: 999px; }
  #vignette { position: absolute; inset: 0; pointer-events: none;
    background: radial-gradient(ellipse at 50% 45%, rgba(0,0,0,0) 55%, rgba(20,10,40,0.28) 100%); }
  #iris { position: absolute; inset: 0; pointer-events: none; }
</style>
<script src="/lib/polygon-clipping.umd.min.js"></script>
<script type="importmap">
{ "imports": { "three": "/three/build/three.module.js", "three/addons/": "/three/examples/jsm/" } }
</script>
</head>
<body>
<div id="stage"><div id="ui"></div><div id="vignette"></div><div id="iris"></div></div>
<script type="module" src="/app.js"></script>
</body>
</html>
